    <style>
      /* Painted before React mounts so there is never a white flash. */
      html,
      body {
        margin: 0;
        background: #0b1f3a;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: radial-gradient(900px 600px at 50% 40%, #12304f 0%, #0b1f3a 55%, #071223 100%);
        transition:
          opacity 0.5s ease,
          visibility 0.5s ease;
      }
      #boot.done {
        opacity: 0;
        visibility: hidden;
      }
      #boot img {
        width: 132px;
        opacity: 0.96;
        animation: bootPulse 2.2s ease-in-out infinite;
      }
      @keyframes bootPulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.85;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img {
          animation: none;
        }
      }
    </style>
